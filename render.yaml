services:
  - type: web
    name: csv-statistics-voila
    runtime: python
    plan: free
    buildCommand: >-
      python -m pip install --upgrade pip &&
      pip install -r requirements.txt &&
      python build_notebook.py
    startCommand: >-
      voila app.ipynb --no-browser
      --Voila.ip=0.0.0.0
      --port=$PORT
    healthCheckPath: /
    autoDeploy: true